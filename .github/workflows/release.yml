name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: msvc-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: msvc-cargo-

      - name: Install Tauri CLI
        run: npm i -g @tauri-apps/cli

      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: UI regression tests
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Build MSI
        working-directory: src-tauri
        run: npx tauri build

      - name: Collect artifacts
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $src = "src-tauri/target/release/bundle/msi/LibreRAM_${version}_x64_ru-RU.msi"
          $dst = "LibreRAM-${version}-preview-x64-tauri.msi"
          Copy-Item $src $dst
          $hash = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower()
          "$hash  $dst" | Out-File -NoNewline "$dst.sha256" -Encoding ascii
          "MSI_NAME=$dst" | Out-File $env:GITHUB_ENV -Append

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: false
          files: |
            ${{ env.MSI_NAME }}
            ${{ env.MSI_NAME }}.sha256

      - name: Upload build artifact (manual runs)
        if: github.ref != 'refs/tags/'
        uses: actions/upload-artifact@v4
        with:
          path: LibreRAM-*preview-x64-tauri.msi*
